<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Hero Lab</title>
    <script>
      // GitHub Pages는 SPA 라우트를 모르므로, 경로를 쿼리로 인코딩해 index.html로 보낸다.
      // segmentCount: 사용자 사이트(<id>.github.io)는 0, 프로젝트 페이지(/repo/)는 1.
      var segmentCount = 0
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
